  <body>
    <div id="root">
      <div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0c1118;color:#f7f9ff;font-family:-apple-system,BlinkMacSystemFont,'Plus Jakarta Sans',sans-serif;">
        <div style="text-align:center;padding:24px;">
          <div style="font-size:18px;font-weight:700;letter-spacing:-0.01em;">Raa's Diary</div>
          <div style="font-size:12px;color:#a5aec0;margin-top:6px;">Loading your workspace...</div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var recoveredKey = 'raa_sw_recovered';
        function clearStaleSwAndReload() {
          if (sessionStorage.getItem(recoveredKey)) return;
          sessionStorage.setItem(recoveredKey, '1');
          var tasks = [];
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              }).catch(function () {})
            );
          }
          if ('caches' in window) {
            tasks.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).catch(function () {})
            );
          }
          Promise.all(tasks).finally(function () {
            window.location.reload();
          });
        }
        window.addEventListener('error', function (ev) {
          var msg = (ev && (ev.message || (ev.target && ev.target.src))) || '';
          if (String(msg).match(/chunk|dynamically imported module|Loading CSS|failed to fetch/i) || (ev.target && ev.target.tagName === 'SCRIPT')) {
            clearStaleSwAndReload();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          var reason = ev && ev.reason ? String(ev.reason.message || ev.reason) : '';
          if (reason.match(/chunk|dynamically imported module|Importing a module script failed/i)) {
            clearStaleSwAndReload();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
