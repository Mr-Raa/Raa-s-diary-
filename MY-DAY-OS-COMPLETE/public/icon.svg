<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Obsidian Slate Background -->
    <linearGradient id="orbit-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Subtle Cyan Ambient Radial Glow -->
    <radialGradient id="orbit-glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Specular Rim -->
    <linearGradient id="orbit-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06" />
    </linearGradient>
  </defs>

  <!-- iOS Apple Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#orbit-bg)" />
  <rect width="512" height="512" rx="118" fill="url(#orbit-glow)" />
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="url(#orbit-rim)" stroke-width="3" />

  <!-- Dawn Orbit Emblem Centered -->
  <g transform="translate(89.6, 89.6) scale(2.6)">
    <!-- Orbit Circle (Full Cycle) -->
    <path
      d="M89.8 21.8A49 49 0 1 0 112 64"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Rising Sun (Fresh Start Cyan Accent) -->
    <path
      d="M46 74a18 18 0 0 1 36 0"
      stroke="#69D4FF"
      stroke-width="7"
      stroke-linecap="round"
    />

    <!-- Horizon Line (Daily Grounding) -->
    <path
      d="M30 77h68"
      stroke="#FFFFFF"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>
</svg>
