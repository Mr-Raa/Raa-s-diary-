services:
  - type: web
    name: raas-diary
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /var/data
    disk:
      name: diary-data
      mountPath: /var/data
      sizeGB: 1
